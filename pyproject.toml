[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "husk"
version = "0.1.0"
description = "A minimal, domain-agnostic agent kernel: an LLM in a tool-using loop. Under 800 SLOC, one runtime dependency."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Fernando Irún" }]
keywords = ["agent", "llm", "tools", "sandbox", "minimal", "react"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Runtime dependencies. The design budget is <= 3; we ship with 1.
# (hatchling above is a *build* backend, not a runtime dependency.)
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/fernandoirun/husk"

[project.scripts]
husk = "husk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/husk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
